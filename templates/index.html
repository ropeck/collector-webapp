<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Collector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #ccc; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Today's Videos</a>
        <a href="/latest">Latest Video</a>
        <a href="/gallery">Monthly Compilations</a>
        <a href="/sunset-gallery">Sunset Collections</a>
    </nav>
    <h1>Camera Collector Videos</h1>
    <ul>
        {% for video in videos %}
        <li><a href="/video/{{ video.name }}">{{ video.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
